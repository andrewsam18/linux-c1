<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="swiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <img src="slider-img/images/aston-martin.jpg" alt="Aston Martin">
            </div>
            <div class="swiper-slide">
                <img src="slider-img/images/audi-rs-e-tron-gt.jpg" alt="Audi">
            </div>
            <div class="swiper-slide">
                <img src="slider-img/images/maserati-mc20.jpg" alt="Maserati">
            </div>
            <div class="swiper-slide">
                <img src="slider-img/images/nio-et5.jpg" alt="Nio ET5">
            </div>
        </div>

        <!-- Controls -->
        <div class="swiper-pagination"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
    </div>
</div>

<!-- Swiper JS (must be first) -->
<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

<!-- Custom JS -->
<script src="script.js"></script>

</body>
</html>
