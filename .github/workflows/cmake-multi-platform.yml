name: CMake on multiple platforms

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            compiler: gcc

          - name: Ubuntu Clang
            os: ubuntu-latest
            compiler: clang

          - name: Windows MSVC
            os: windows-latest
            compiler: msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Show source files
        shell: bash
        run: |
          echo "===== C files ====="
          find c -type f -name "*.c" -print 2>/dev/null || true

          echo "===== C++ files ====="
          find cpp -type f -name "*.cpp" -print 2>/dev/null || true

      - name: Create temporary CMakeLists.txt
        shell: bash
        run: |
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)

          project(LinuxC1
              LANGUAGES C CXX
          )

          set(CMAKE_C_STANDARD 11)
          set(CMAKE_CXX_STANDARD 17)

          file(GLOB_RECURSE C_SOURCES CONFIGURE_DEPENDS
              "${CMAKE_SOURCE_DIR}/c/*.c"
          )

          file(GLOB_RECURSE CPP_SOURCES CONFIGURE_DEPENDS
              "${CMAKE_SOURCE_DIR}/cpp/*.cpp"
          )

          message(STATUS "C sources:")
          foreach(SOURCE ${C_SOURCES})
              message(STATUS "  ${SOURCE}")
          endforeach()

          message(STATUS "C++ sources:")
          foreach(SOURCE ${CPP_SOURCES})
              message(STATUS "  ${SOURCE}")
          endforeach()

          set(C_INDEX 0)

          foreach(SOURCE ${C_SOURCES})
              math(EXPR C_INDEX "${C_INDEX} + 1")

              add_library(
                  c_source_${C_INDEX}
                  OBJECT
                  "${SOURCE}"
              )

              target_include_directories(
                  c_source_${C_INDEX}
                  PRIVATE
                  "${CMAKE_SOURCE_DIR}/c"
              )
          endforeach()

          set(CPP_INDEX 0)

          foreach(SOURCE ${CPP_SOURCES})
              math(EXPR CPP_INDEX "${CPP_INDEX} + 1")

              add_library(
                  cpp_source_${CPP_INDEX}
                  OBJECT
                  "${SOURCE}"
              )

              target_include_directories(
                  cpp_source_${CPP_INDEX}
                  PRIVATE
                  "${CMAKE_SOURCE_DIR}/cpp"
              )
          endforeach()

          if(NOT C_SOURCES AND NOT CPP_SOURCES)
              message(FATAL_ERROR
                  "No .c or .cpp source files were found in c/ or cpp/"
              )
          endif()
          EOF

      - name: Configure CMake - GCC
        if: matrix.compiler == 'gcc'
        shell: bash
        run: |
          cmake -S . -B build \
            -G "Unix Makefiles" \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++

      - name: Configure CMake - Clang
        if: matrix.compiler == 'clang'
        shell: bash
        run: |
          cmake -S . -B build \
            -G "Unix Makefiles" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Configure CMake - MSVC
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: |
          cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Build summary
        shell: bash
        run: |
          echo "======================================"
          echo "CMake compilation completed successfully"
          echo "Platform : ${{ matrix.os }}"
          echo "Compiler : ${{ matrix.compiler }}"
          echo "======================================"
