name: C/C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            compiler: gcc

          - name: Ubuntu Clang
            os: ubuntu-latest
            compiler: clang

          - name: Windows MSVC
            os: windows-latest
            compiler: msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GCC
        if: matrix.compiler == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Clang
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Show C/C++ source files
        shell: bash
        run: |
          echo "===== C files ====="
          find c -type f -name "*.c" -print 2>/dev/null || true

          echo "===== C++ files ====="
          find cpp -type f -name "*.cpp" -print 2>/dev/null || true

      - name: Compile C files with GCC
        if: matrix.compiler == 'gcc'
        shell: bash
        run: |
          mkdir -p build/c

          found=0

          while IFS= read -r file; do
            found=1

            name=$(echo "$file" | sed 's#[/\\]#_#g')
            output="build/c/${name%.c}.o"

            echo "Compiling C: $file"

            gcc \
              -Wall \
              -Wextra \
              -std=c11 \
              -c "$file" \
              -o "$output"

          done < <(find c -type f -name "*.c" 2>/dev/null)

          if [ "$found" -eq 0 ]; then
            echo "No C files found in c/"
          fi

      - name: Compile C++ files with GCC
        if: matrix.compiler == 'gcc'
        shell: bash
        run: |
          mkdir -p build/cpp

          found=0

          while IFS= read -r file; do
            found=1

            name=$(echo "$file" | sed 's#[/\\]#_#g')
            output="build/cpp/${name%.cpp}.o"

            echo "Compiling C++: $file"

            g++ \
              -Wall \
              -Wextra \
              -std=c++17 \
              -c "$file" \
              -o "$output"

          done < <(find cpp -type f -name "*.cpp" 2>/dev/null)

          if [ "$found" -eq 0 ]; then
            echo "No C++ files found in cpp/"
          fi

      - name: Compile C files with Clang
        if: matrix.compiler == 'clang'
        shell: bash
        run: |
          mkdir -p build/c

          found=0

          while IFS= read -r file; do
            found=1

            name=$(echo "$file" | sed 's#[/\\]#_#g')
            output="build/c/${name%.c}.o"

            echo "Compiling C: $file"

            clang \
              -Wall \
              -Wextra \
              -std=c11 \
              -c "$file" \
              -o "$output"

          done < <(find c -type f -name "*.c" 2>/dev/null)

          if [ "$found" -eq 0 ]; then
            echo "No C files found in c/"
          fi

      - name: Compile C++ files with Clang
        if: matrix.compiler == 'clang'
        shell: bash
        run: |
          mkdir -p build/cpp

          found=0

          while IFS= read -r file; do
            found=1

            name=$(echo "$file" | sed 's#[/\\]#_#g')
            output="build/cpp/${name%.cpp}.o"

            echo "Compiling C++: $file"

            clang++ \
              -Wall \
              -Wextra \
              -std=c++17 \
              -c "$file" \
              -o "$output"

          done < <(find cpp -type f -name "*.cpp" 2>/dev/null)

          if [ "$found" -eq 0 ]; then
            echo "No C++ files found in cpp/"
          fi

      - name: Setup MSVC
        if: matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile C/C++ with MSVC
        if: matrix.compiler == 'msvc'
        shell: cmd
        run: |
          if exist c (
            for /R c %%F in (*.c) do (
              echo Compiling C: %%F
              cl /nologo /W3 /c "%%F" /Fo"build_%%~nF.obj"
              if errorlevel 1 exit /b 1
            )
          )

          if exist cpp (
            for /R cpp %%F in (*.cpp) do (
              echo Compiling C++: %%F
              cl /nologo /W3 /std:c++17 /c "%%F" /Fo"build_%%~nF.obj"
              if errorlevel 1 exit /b 1
            )
          )

      - name: Build successful
        run: echo "C/C++ compilation completed successfully."
