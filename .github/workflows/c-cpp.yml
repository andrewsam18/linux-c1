name: C/C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C/C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Find C and C++ files
        run: |
          echo "C files:"
          find c cpp -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.hpp" \) -print

      - name: Compile C files
        run: |
          found=0
          while IFS= read -r file; do
            found=1
            echo "Compiling C: $file"
            gcc -Wall -Wextra -c "$file" -o /tmp/$(basename "$file").o
          done < <(find c -type f -name "*.c")

          if [ "$found" -eq 0 ]; then
            echo "No C files found."
          fi

      - name: Compile C++ files
        run: |
          found=0
          while IFS= read -r file; do
            found=1
            echo "Compiling C++: $file"
            g++ -Wall -Wextra -c "$file" -o /tmp/$(basename "$file").o
          done < <(find cpp -type f -name "*.cpp")

          if [ "$found" -eq 0 ]; then
            echo "No C++ files found."
          fi
