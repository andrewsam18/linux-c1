
name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build C/C++ files
        run: |
          if ls *.c 1> /dev/null 2>&1; then
            gcc *.c -o program
          elif ls *.cpp 1> /dev/null 2>&1; then
            g++ *.cpp -o program
          else
            echo "No .c or .cpp source files found."
            exit 1
          fi
