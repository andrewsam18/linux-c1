name: Laravel

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  laravel-tests:
    name: Laravel Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
          coverage: none
          tools: composer

      - name: Check PHP version
        run: php -v

      - name: Check Composer
        run: composer --version

      - name: Check Laravel project
        run: |
          if [ ! -f composer.json ]; then
            echo "::error::composer.json not found. This repository does not appear to contain a Laravel project at the root."
            exit 1
          fi

          if [ ! -f artisan ]; then
            echo "::error::artisan file not found. Make sure this workflow is running from the Laravel project root."
            exit 1
          fi

      - name: Copy .env
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Prepare SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Configure test environment
        run: |
          {
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=${{ github.workspace }}/database/database.sqlite"
          } >> .env

      - name: Directory permissions
        run: |
          chmod -R 775 storage bootstrap/cache

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run Laravel tests
        run: php artisan test
