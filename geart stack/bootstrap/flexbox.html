    <h1>Carousel</h1>
    <div id="carouselExample" class="carousel slide bg-dark" data-bs-ride="carousel">
        <div class="carousel-inner text-light">
            <div class="carousel-item active" data-bs-interval="2000">
                <div class="d-flex justify-content-center">
                    <img src="https://picsum.photos/id/0/200/200" alt="First Slide Image">
                </div>
                <div class="carousel-caption">
                    <h5>First Slide</h5>
                    <p>Some Text about the person</p>
                </div>
            </div>
            <div class="carousel-item " data-bs-interval="2000">
                <div class="d-flex justify-content-center">
                    <img src="https://picsum.photos/id/1/200/200" alt="Second Slide Image">
                </div>
            </div>
            <div class="carousel-item " data-bs-interval="2000">
                <div class="d-flex justify-content-center">
                    <img src="https://picsum.photos/id/6/200/200" alt="Third Slide Image">
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

<script src="https://github.com/twbs/bootstrap/blob/v5.3.7/site/src/assets/partials/snippets.js"></script>
<script>

    const toastTrigger = document.getElementById('liveToastBtn')
    const toastLiveExample = document.getElementById('liveToast')

    if (toastTrigger) {
        const toastBootstrap = bootstrap.Toast.getOrCreateInstance(toastLiveExample)
        toastTrigger.addEventListener('click', () => {
            toastBootstrap.show()
        })
    }
</script>
